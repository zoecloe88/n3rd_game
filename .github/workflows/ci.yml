name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests

      - name: Check coverage threshold
        run: |
          if [ -f scripts/check_coverage.sh ]; then
            bash scripts/check_coverage.sh
          else
            echo "Coverage check script not found, skipping..."
          fi

  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Run security audit script
        run: |
          if [ -f scripts/security_audit.sh ]; then
            bash scripts/security_audit.sh
          else
            echo "Security audit script not found, skipping..."
          fi

      - name: Run secret scanning
        run: |
          if [ -f scripts/secret_scan.sh ]; then
            bash scripts/secret_scan.sh
          else
            echo "Secret scan script not found, skipping..."
          fi

      - name: Check API restrictions
        run: |
          if [ -f scripts/verify_api_restrictions.sh ]; then
            bash scripts/verify_api_restrictions.sh
          else
            echo "API restrictions script not found, skipping..."
          fi

      - name: Dependency vulnerability scan
        run: |
          if [ -f scripts/dependency_vulnerability_scan.sh ]; then
            bash scripts/dependency_vulnerability_scan.sh
          else
            echo "Dependency vulnerability scan script not found, skipping..."
          fi

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Complexity analysis
        run: |
          if [ -f scripts/analyze_complexity.sh ]; then
            bash scripts/analyze_complexity.sh
          else
            echo "Complexity analysis script not found, skipping..."
          fi

      - name: Validate service dependencies
        run: |
          if [ -f scripts/validate_service_dependencies.dart ]; then
            dart scripts/validate_service_dependencies.dart
          else
            echo "Service dependencies validation script not found, skipping..."
          fi

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run linter
        run: flutter analyze --fatal-infos

  # Summary job that depends on all other jobs
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test, analyze, format-check, build-android, build-ios, build-web, security-scan, code-quality, lint]
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "All CI jobs completed"
          echo "Test: ${{ needs.test.result }}"
          echo "Analyze: ${{ needs.analyze.result }}"
          echo "Format: ${{ needs.format-check.result }}"
          echo "Build Android: ${{ needs.build-android.result }}"
          echo "Build iOS: ${{ needs.build-ios.result }}"
          echo "Build Web: ${{ needs.build-web.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Lint: ${{ needs.lint.result }}"














