name: Bugbot Full Project Scan

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        id: analyze
        run: |
          flutter analyze --no-fatal-infos > analyze_output.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check code formatting
        run: |
          dart format --set-exit-if-changed . > format_output.txt 2>&1 || true
          echo "format_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Save analyze output
        if: always()
        run: |
          mkdir -p .bugbot
          mv analyze_output.txt .bugbot/analyze_output.txt || true
          mv format_output.txt .bugbot/format_output.txt || true

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: .bugbot/analyze_output.txt
          if-no-files-found: ignore

  memory-leak-detection:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run memory leak scanner
        id: memory_scan
        run: |
          dart scripts/scan_memory_leaks.dart > memory_leaks.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run resource disposal checker
        id: resource_check
        run: |
          dart scripts/check_resource_disposal.dart > resource_disposal.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run test pattern validator
        id: test_patterns
        run: |
          dart scripts/validate_test_patterns.dart > test_patterns.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Save memory leak results
        if: always()
        run: |
          mkdir -p .bugbot
          mv memory_leaks.txt .bugbot/memory_leaks.txt || true
          mv resource_disposal.txt .bugbot/resource_disposal.txt || true
          mv test_patterns.txt .bugbot/test_patterns.txt || true

      - name: Upload memory leak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-leak-results
          path: .bugbot/
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Check for hardcoded secrets
        id: secrets
        run: |
          mkdir -p .bugbot
          echo "Checking for hardcoded secrets..." > .bugbot/secrets.txt
          if grep -r "AIza[0-9A-Za-z_-]\{35\}" lib/ --exclude-dir=generated 2>/dev/null | grep -v "//.*API" | grep -v "example" | grep -v "test"; then
            echo "::error::Potential hardcoded API keys found" >> .bugbot/secrets.txt
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No hardcoded API keys found" >> .bugbot/secrets.txt
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check dependency vulnerabilities
        run: |
          flutter pub get
          flutter pub outdated >> .bugbot/dependencies.txt 2>&1 || true
        continue-on-error: true

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: .bugbot/
          if-no-files-found: ignore

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run complexity analysis
        run: |
          mkdir -p .bugbot
          flutter analyze --no-fatal-infos | grep -E "(error|warning)" > .bugbot/complexity.txt || echo "No complexity issues found" > .bugbot/complexity.txt
        continue-on-error: true

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-results
          path: .bugbot/
          if-no-files-found: ignore

  test-suite-analysis:
    name: Test Suite Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        id: tests
        run: |
          flutter test --coverage > test_output.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Analyze test results
        run: |
          mkdir -p .bugbot
          if [ -f test_output.txt ]; then
            grep -E "(FAILED|ERROR|Exception)" test_output.txt > .bugbot/test_failures.txt || echo "No test failures found" > .bugbot/test_failures.txt
            mv test_output.txt .bugbot/test_output.txt
          fi
        continue-on-error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .bugbot/
          if-no-files-found: ignore

  generate-bug-report:
    name: Generate Bug Report
    runs-on: ubuntu-latest
    needs: [static-analysis, memory-leak-detection, security-scan, code-quality, test-suite-analysis]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate comprehensive bug report
        run: |
          dart scripts/generate_bug_report.dart

      - name: Upload bug report
        uses: actions/upload-artifact@v4
        with:
          name: bugbot-full-report
          path: bugbot_report.md
          if-no-files-found: ignore

      - name: Create GitHub Issue (if critical findings)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let shouldCreateIssue = false;
            
            try {
              if (fs.existsSync('bugbot_report.md')) {
                const report = fs.readFileSync('bugbot_report.md', 'utf8');
                // Check for critical issues
                if (report.includes('## Critical Issues') || report.includes('CRITICAL')) {
                  shouldCreateIssue = true;
                }
              }
            } catch (e) {
              console.log('Could not read report file');
            }
            
            if (shouldCreateIssue) {
              const title = `Bugbot Scan Report - ${new Date().toISOString().split('T')[0]}`;
              const body = `🤖 **Automated Bugbot Full Project Scan**
              
              This issue was automatically created by the Bugbot workflow.
              
              See the workflow run for full details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              
              Download the full report from the workflow artifacts.
              `;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bugbot', 'automated']
              });
            }




